name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Check the payload template
        run: go run ./cmd/harness check --root template --format github --report-dir docs-link-report

      - name: Upload link reports
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: docs-link-report
          path: docs-link-report/
          if-no-files-found: ignore
          retention-days: 14
