name: Documentation integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-integrity:
    name: Document metadata, indexes, and links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/scripts/requirements.txt

      - name: Install documentation dependencies
        id: dependencies
        run: python -m pip install -r docs/scripts/requirements.txt

      - name: Test documentation scripts
        run: python -m unittest discover -s docs/scripts/tests -v

      - name: Validate plans and generated indexes
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python docs/scripts/sync-plans.py --check

      - name: Validate specifications and state indexes
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python docs/scripts/sync-specifications.py --check

      - name: Validate research and its state index
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python docs/scripts/sync-research.py --check

      - name: Check all documentation links
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python docs/scripts/check-doc-links.py --format github --report-dir docs-link-report

      - name: Upload complete link reports
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: docs-link-report
          path: docs-link-report/
          if-no-files-found: error
          retention-days: 14
